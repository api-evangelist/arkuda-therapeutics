name: Arkuda Therapeutics
description: 'Arkuda Therapeutics, Inc. was a privately held, preclinical-stage biotechnology
  company based in Watertown, Massachusetts, founded in 2018 by Gerhard Koenig, Ph.D. and
  Duane Burnett to develop small-molecule enhancers of lysosomal function for neurodegenerative
  disease. Its lead biology targeted progranulin (GRN) and lysosomal dysfunction in
  frontotemporal dementia (FTD-GRN), Alzheimer''s disease and Parkinson''s disease. Arkuda
  closed a $44M Series A in November 2019 and a $64M Series B in February 2022, backed by
  Atlas Venture, Cormorant Asset Management, Pfizer Ventures, abrdn plc, Mission BioCapital
  and Eli Lilly and Company. On 27 February 2024 it entered an option and asset purchase
  agreement with Johnson & Johnson, and on 9 January 2025 Johnson & Johnson (through Janssen
  Pharmaceuticals) exercised that option and acquired the entire portfolio of lysosomal
  function enhancers. Independent operations concluded thereafter; founder and CEO Gerhard
  Koenig became CEO of Augustine Therapeutics in January 2025. Arkuda was a therapeutics
  developer, not a software company: it never operated a developer program, public API,
  SDK or machine-readable API contract, and both of its former domains have since lapsed.'
